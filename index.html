var OPENINGS = [{"id":"italian","name":"Italian Game (Giuoco Pianissimo)","eco":"C50–C54","side":"w","intro":"The oldest open game. White develops quickly, points the bishop at f7, and builds a slow, harmonious position with c3 and d3 before breaking with d3–d4 later. Modern grandmasters love it because it is solid and full of maneuvering ideas.","ideas":["Bishop on c4 (later b3) eyes f7","c3 + d3 = solid center, d4 comes later","Knight tour b1–d2–f1–g3 toward the kingside","h3 stops ...Bg4 pins"],"structure":"Symmetrical open center: White pawns e4/d3/c3 vs Black e5/d6. Neither side has weaknesses, so plans are about piece placement and the timing of d4 (or ...d5).","moves":[["e4","Grab the center and open lines for the queen and the f1-bishop.","","d5 f5"],["e5","Black claims an equal share of the center and frees the f8-bishop."],["Nf3","Develops with a threat: the knight attacks the e5-pawn.","f3e5"],["Nc6","Defends e5 with a developing move; the knight also eyes d4.","c6e5"],["Bc4","The Italian bishop aims at f7 — the weakest square in Black's camp, guarded only by the king.","c4f7","f7"],["Bc5","Black copies the idea: the bishop eyes f2 and controls d4.","c5f2"],["c3","Prepares d4 to build a big pawn center, and gives the c4-bishop a future retreat to b3/c2.","c3d4"],["Nf6","Develops and attacks e4 — White's knight can no longer defend it from c3.","f6e4"],["d3","The calm Pianissimo: defend e4 with a pawn, keep everything solid and save d3–d4 for later.","d3e4"],["d6","Supports e5 and opens the diagonal of the c8-bishop."],["O-O","King to safety; the rook gets closer to the center."],["O-O","Black also tucks the king away."],["Re1","The rook supports e4 and prepares d4 by watching the e-file.","e1e4"],["a6","Makes room: now the c5-bishop can retreat to a7 if White plays d4, and ...b5 becomes possible.","c5a7"],["Bb3","Moves before ...b5 or ...Na5 can hit the bishop; on b3 it still pressures f7.","b3f7"],["Ba7","Black retreats in advance so that d3–d4 will not come with tempo; on a7 the bishop still aims at f2.","a7f2"],["h3","Stops ...Bg4 (pinning the f3-knight) and ...Ng4, and gives the king an escape square.","","g4"],["h6","The same prophylaxis for Black: no Bg5 pin.","","g5"],["Nbd2","Starts the classic Italian knight tour: d2–f1–g3, heading toward the kingside.","d2f1 f1g3"],["Re8","The rook supports e5 on the e-file."],["Nf1","Continues the maneuver; the d2-square is cleared so the c1-bishop can develop.","f1g3"],["Be6","Challenges White's strong b3-bishop. A trade on e6 would give Black a solid center.","e6b3"],["Ng3","The knight arrives on g3, eyeing f5 and h5. White's setup is complete; d3–d4 or Nh4–f5 come next.","g3f5 g3h5"]],"sidelines":[{"name":"3...Nf6 (Two Knights, quiet 4.d3)","from":5,"moves":[["Nf6","The Two Knights Defense: Black counterattacks e4 at once.","f6e4"],["d3","Calm and solid: e4 is defended and White avoids the sharp 4.Ng5.","d3e4"],["Be7","A modest setup; Black prepares to castle."],["O-O","King safety first."],["O-O","Black castles too."],["Re1","Supports e4 and prepares c3 + d4."],["d6","Supports e5 and opens the c8-bishop."],["c3","Same plan as the main line: c3, then a later d4.","c3d4"]]}]},{"id":"ruy","name":"Ruy Lopez (Closed, Chigorin)","eco":"C84–C99","side":"w","intro":"The Spanish Game. Instead of hitting f7, White's bishop attacks the c6-knight — the defender of e5. White builds slowly with c3, h3 and d4 and keeps long-lasting pressure. It is one of the deepest openings in chess.","ideas":["Bb5 pressures the defender of e5","Re1 + d4 to challenge the center","Bishop retreats to the b3/c2 diagonal","Knight maneuver Nbd2–f1–g3"],"structure":"After d4 and ...c5, White has a strong center (d4/e4) and kingside space; Black has queenside space and pressure on d4. The center often closes with d5.","moves":[["e4","Center pawn, opens lines."],["e5","Black meets the center symmetrically."],["Nf3","Develops and attacks e5.","f3e5"],["Nc6","Defends e5."],["Bb5","The Spanish bishop attacks the knight that defends e5 — indirect pressure on Black's center.","b5c6","e5"],["a6","The Morphy Defense: question the bishop right away."],["Ba4","Keep the bishop (4.Bxc6 is the Exchange Variation). It stays on the a4–e8 diagonal."],["Nf6","Develops and attacks e4.","f6e4"],["O-O","White castles and lets e4 hang for a moment: after ...Nxe4 White has Re1 and d4 with good play (the Open Ruy Lopez)."],["Be7","The Closed Ruy Lopez: Black prepares to castle and keeps things solid."],["Re1","Now e4 is truly protected, so White threatens Bxc6 followed by Nxe5.","a4c6 f3e5"],["b5","Removes the threat to e5 by driving the bishop away."],["Bb3","The bishop settles on its best diagonal, pointing at f7.","b3f7"],["d6","Supports e5 solidly and opens the c8-bishop."],["c3","Prepares d4 and makes c2 available for the bishop.","c3d4"],["O-O","Black castles."],["h3","Prevents ...Bg4, which would pin the f3-knight and add pressure to d4 once White plays it.","","g4"],["Na5","The Chigorin plan: chase the strong bishop and prepare ...c5 to fight for d4.","a5b3"],["Bc2","The bishop keeps the b1–h7 diagonal and supports e4.","c2h7"],["c5","Gains queenside space and pressures d4.","c5d4"],["d4","White finally strikes in the center with full support from c3, the queen and the f3-knight."],["Qc7","Defends e5 and c5 and connects the rooks.","c7e5"],["Nbd2","The knight heads for f1 and g3 (or e3) — the standard Spanish maneuver.","d2f1 f1g3"]]},{"id":"scotch","name":"Scotch Game (Mieses)","eco":"C45","side":"w","intro":"White opens the center at move 3 with d4. The game becomes concrete quickly: White gets free development and space, Black gets active pieces. In the Mieses line White doubles Black's pawns and gains space with e5 and c4.","ideas":["3.d4 opens the center immediately","Nxc6 gives Black doubled c-pawns","e5 + c4 gain space and chase the knight","Watch the e-file pin (queen vs king)"],"structure":"White has pawns on e5/c4 (space), Black has doubled c-pawns but the bishop pair and active pieces.","moves":[["e4","Center pawn."],["e5","Symmetrical reply."],["Nf3","Attacks e5.","f3e5"],["Nc6","Defends e5."],["d4","The Scotch: White opens the center immediately instead of building slowly.","d4e5"],["exd4","Black takes; trying to hold e5 with ...d6 would leave Black passive."],["Nxd4","The knight recaptures and stands proudly in the center. White has the e4-pawn, Black has no central pawn."],["Nf6","The Schmidt Variation: Black counterattacks e4 at once.","f6e4"],["Nxc6","The Mieses Variation: trade first, doubling Black's c-pawns."],["bxc6","Black recaptures toward the center; the b-file opens for a rook."],["e5","Gains space with tempo, kicking the f6-knight.","e5f6"],["Qe7","Attacks e5, and the queen pins the pawn along the e-file to White's king.","e7e1"],["Qe2","Defends e5 and blocks the e-file. White does not fear the queen trade."],["Nd5","The knight jumps to a fine central square."],["c4","Chases the knight and grabs queenside space.","c4d5"],["Ba6","Clever: the bishop pins the c4-pawn to the queen on e2, so c4xd5 is impossible for now.","a6e2"],["b3","Defends c4 so the pin no longer matters; White will develop with Bb2 and g3/Bg2.","b3c4"]]},{"id":"london","name":"London System","eco":"D02","side":"w","intro":"A system rather than a single line: White sets up d4, Bf4, e3, c3, Nf3, Nbd2 and Bd3 against almost anything. The plans are easy to learn: a solid pyramid in the center, a kingside attack with Ne5 and the queen, and the e3–e4 break.","ideas":["Develop the c1-bishop BEFORE e3","Pawn triangle c3–d4–e3","Ne5 outpost","If ...Bd6 trades bishops, recapture hxg3 to open the h-file"],"structure":"White: c3/d4/e3 pyramid. Black usually plays ...d5/...e6/...c5. The center is stable, so piece placement decides the game.","moves":[["d4","Center pawn; supports a later e4 and Ne5."],["d5","Black meets it symmetrically."],["Bf4","The London bishop develops outside the pawn chain before e3 locks it in.","f4b8"],["Nf6","Natural development."],["e3","Builds the solid center and opens the f1-bishop."],["e6","Black opens the f8-bishop."],["Nf3","Develops and controls e5.","f3e5"],["c5","Black challenges d4 — the main way to fight the London.","c5d4"],["c3","Supports d4 and completes the c3–d4–e3 triangle.","c3d4"],["Nc6","Adds pressure on d4."],["Nbd2","Keeps c3 for the pawn and supports e4 and f3."],["Bd6","Offers to trade White's good dark-squared bishop.","d6f4"],["Bg3","Keeps the bishop. If ...Bxg3, hxg3 opens the h-file for White's rook.","","h2"],["O-O","Black castles."],["Bd3","The bishop goes to its best diagonal, aimed at h7.","d3h7"],["b6","Prepares ...Bb7 to fight for e4."],["Ne5","The knight lands on the e5 outpost, supported by d4 and the g3-bishop.","g3e5","e5"],["Bb7","The bishop develops and watches e4."],["Qf3","The queen joins the kingside (Qh3 ideas) and covers e4, preparing e3–e4 or a pawn storm.","f3h3"]]},{"id":"qgd","name":"Queen's Gambit Declined (Orthodox)","eco":"D63–D67","side":"w","intro":"White offers the c-pawn to pull Black's d-pawn out of the center. In the Declined Black keeps the strong point on d5 but has a cramped position and a passive c8-bishop. White fights for small advantages; Black aims for freeing trades and the ...e5 or ...c5 break.","ideas":["c4 attacks d5 from the side","Bg5 pins the defender of d5","Rc1 for the c-file","Tempo battle: Black takes on c4 only after White's bishop moves"],"structure":"White pawns c4/d4/e3 vs Black d5/e6/c6. The key question is how Black frees the c8-bishop.","moves":[["d4","Center pawn."],["d5","Black stops e4."],["c4","The Queen's Gambit: offer a wing pawn to deflect Black's d-pawn from the center.","c4d5"],["e6","Declined: Black keeps the d5 point solid but blocks the c8-bishop."],["Nc3","Adds pressure on d5.","c3d5"],["Nf6","Defends d5."],["Bg5","Pins the knight that defends d5.","g5d8"],["Be7","Breaks the pin."],["e3","Solid: supports d4 and opens the f1-bishop."],["O-O","Black castles."],["Nf3","Develops and controls e5."],["Nbd7","A flexible square that supports both ...c5 and ...e5 breaks."],["Rc1","The rook takes the c-file, which will open after an exchange on c4 or d5.","c1c8"],["c6","Supports d5 and prepares the freeing maneuver."],["Bd3","The bishop develops — this is when Black takes on c4."],["dxc4","Black waited for Bd3 so that White spends a second move with the bishop when recapturing (the tempo battle)."],["Bxc4","Recapture."],["Nd5","Capablanca's freeing maneuver: offer trades to relieve the cramped position.","d5c3"],["Bxe7","Trading bishops."],["Qxe7","Recapture."],["O-O","White castles."],["Nxc3","Another trade."],["Rxc3","The rook recaptures and stays active on the c-file."],["e5","The liberating break: the c8-bishop finally sees daylight. White keeps a small edge in space.","c8g4"]]},{"id":"najdorf","name":"Sicilian Najdorf (Opočenský 6.Be2)","eco":"B92","side":"b","intro":"The Sicilian answers 1.e4 asymmetrically: Black trades the c-pawn for White's d-pawn and gets a central majority and the half-open c-file. The Najdorf's 5...a6 keeps White's pieces out of b5 and prepares ...e5 or ...b5.","ideas":["...a6 controls b5","...e5 grabs space but creates a hole on d5 — control it!","...Be6, ...Nbd7 and ...Rc8 fight for d5 and use the c-file"],"structure":"After ...e5: Black pawns d6/e5 vs White e4. d5 is the key square for both sides; d6 is backward but solidly defended.","moves":[["e4","White opens."],["c5","The Sicilian: fight for d4 from the side and create an unbalanced game.","c5d4"],["Nf3","Prepares d4."],["d6","Controls e5 and prepares ...Nf6 without allowing e4–e5."],["d4","White opens the center."],["cxd4","Trade a wing pawn for a center pawn: Black will have two central pawns (d and e) against one."],["Nxd4","Recapture."],["Nf6","Attacks e4, forcing White to defend it.","f6e4"],["Nc3","Defends e4."],["a6","The Najdorf: keeps White's knights and bishops out of b5 and prepares ...e5 or ...b5.","","b5"],["Be2","The calm Opočenský line: White prepares to castle."],["e5","Kicks the d4-knight and claims space. The cost: a hole on d5 and a backward d6-pawn.","e5d4","d5"],["Nb3","The knight retreats."],["Be7","Develops and prepares to castle."],["O-O","White castles."],["O-O","Black castles."],["Be3","Controls b6 and d4 and prepares Qd2."],["Be6","Fights for d5 — the key square of this structure.","e6d5","d5"],["Qd2","Connects rooks."],["Nbd7","Supports a future ...d5 or ...Nb6 heading toward c4 and d5."],["a4","Stops ...b5, which would gain space and threaten ...b4 to kick the c3-knight.","","b5"],["Rc8","The rook takes the half-open c-file and pressures c3/c2 — typical Sicilian counterplay.","c8c3"]]},{"id":"french","name":"French Defense (Advance)","eco":"C02","side":"b","intro":"In the French, Black challenges e4 with ...e6 and ...d5. In the Advance Variation White gains space with e5; Black immediately attacks the base of the pawn chain (d4) with ...c5, ...Nc6, ...Qb6 and the knight maneuver ...Nh6–f5.","ideas":["Attack the base of the chain (d4)","...Qb6 hits d4 and b2","...Nh6–f5 adds a fourth attacker on d4","Queenside play with ...Bb4 and ...b5"],"structure":"Locked center: White e5/d4 vs Black e6/d5. White has kingside space; Black plays on the queenside and against d4.","moves":[["e4","White opens."],["e6","The French: prepare ...d5 with a pawn that will defend it."],["d4","White builds the classical center."],["d5","Challenge e4 at once.","d5e4"],["e5","The Advance: White gains space and closes the center."],["c5","Strike at the base of White's chain (d4) — the key idea of the French.","c5d4"],["c3","Supports d4."],["Nc6","A second attacker on d4.","c6d4"],["Nf3","A second defender of d4."],["Qb6","A third attacker on d4, and the queen also eyes b2.","b6d4 b6b2"],["Be2","Development; White prepares to castle."],["cxd4","Release the tension to open the c-file."],["cxd4","Recapture."],["Nh6","The knight heads to f5 to attack d4 again. If Bxh6, ...gxh6 gives Black the bishop pair and the g-file.","h6f5"],["Nc3","Develops; the knight can jump to a4 to hit the b6-queen.","c3a4"],["Nf5","Fourth attacker on d4: White must keep defending it.","f5d4"],["Na4","Hits the queen.","a4b6"],["Qa5+","The queen moves with check."],["Bd2","Blocks the check."],["Bb4","Pins the d2-bishop and keeps up the pressure.","b4d2"],["Bc3","The bishop slides along the pin line to challenge Black's b4-bishop."],["b5","Gains queenside space and attacks the a4-knight — typical French queenside play.","b5a4"]]},{"id":"caro","name":"Caro-Kann (Classical)","eco":"B18–B19","side":"b","intro":"Black prepares ...d5 with ...c6, so the light-squared bishop can develop outside the pawn chain (unlike the French). The Classical line gives Black a rock-solid position with no weaknesses; White uses the h-pawn to gain kingside space.","ideas":["...c6 + ...d5 solid center","Develop the c8-bishop BEFORE ...e6","Answer h4 with ...h6, keep the bishop on the b1–h7 diagonal","Castle long or short later, play ...c5 or ...e5 breaks"],"structure":"Black: c6/e6 \"Caro slab\" — very solid. White has a space edge (d4, h5) and quick development.","moves":[["e4","White opens."],["c6","The Caro-Kann: prepare ...d5 with pawn support."],["d4","Classical center."],["d5","Challenge e4.","d5e4"],["Nc3","Defends e4."],["dxe4","Black gives up the center to develop the bishop actively."],["Nxe4","Recapture."],["Bf5","The Classical: develop the bishop with tempo on the knight, before ...e6 shuts it in.","f5e4"],["Ng3","Kicks the bishop.","g3f5"],["Bg6","The bishop retreats and stays on the long diagonal."],["h4","Threatens h5 to trap or kick the bishop and gains kingside space.","h4h5"],["h6","Gives the bishop a retreat on h7.","","h7"],["Nf3","Develops."],["Nd7","Develops and controls e5, so White's knight cannot jump there.","","e5"],["h5","White gains space and fixes Black's h6-pawn."],["Bh7","The bishop retreats."],["Bd3","Offers the bishop trade."],["Bxd3","Trade: Black has no \"bad\" bishop problem anymore."],["Qxd3","Recapture."],["e6","Now ...e6 is fine: the bishop is already out."],["Bd2","Prepares to castle queenside."],["Ngf6","Develops."],["O-O-O","White castles long."],["Be7","Prepares ...O-O (or ...O-O-O), with ...c5 or ...Qc7 to follow."]],"sidelines":[{"name":"3.e5 Advance Variation","from":4,"moves":[["e5","The Advance: White takes space."],["Bf5","Develop the bishop outside the chain — the point of the Caro-Kann."],["Nf3","Develops."],["e6","Opens the f8-bishop."],["Be2","Prepares to castle."],["c5","Strike at d4, the base of White's chain — like the French, but with the bishop already out.","c5d4"]]}]},{"id":"kid","name":"King's Indian Defense (Mar del Plata)","eco":"E97–E99","side":"b","intro":"A hypermodern counterattacking defense. Black lets White build a big center, then strikes with ...e5 and, after the center closes, launches a kingside pawn storm with ...f5–f4–g5–g4 while White attacks on the queenside.","ideas":["Fianchetto: the g7-bishop is the soul of the KID","...e5 to challenge the center","After d5: ...Ne7, ...Nd7, ...f5, ...f4, ...g5 attack","Race: Black kingside vs White queenside"],"structure":"Closed center: White d5/e4/c4 vs Black d6/e5. Black's f-pawn and g-pawn storm the kingside.","moves":[["d4","White opens."],["Nf6","Flexible; controls e4."],["c4","Grabs space."],["g6","Prepare the fianchetto."],["Nc3","Develops, eyeing e4."],["Bg7","The King's Indian bishop on the long diagonal.","g7a1"],["e4","White builds a big center."],["d6","Controls e5 and prevents e4–e5."],["Nf3","Develops."],["O-O","King safety first."],["Be2","Classical setup."],["e5","The key move: Black stakes a claim in the center.","e5d4"],["O-O","White castles."],["Nc6","More pressure on d4, forcing White to decide.","c6d4"],["d5","White closes the center and gains space."],["Ne7","The knight reroutes toward the kingside (g6) and clears the way for the f-pawn.","e7g6"],["Ne1","White prepares queenside play with f3 and c5; the knight may go to d3."],["Nd7","Unblocks the f-pawn — ...f5 is coming.","f7f5"],["Be3","Develops and supports c5."],["f5","The standard break against e4, starting the kingside attack.","f5e4"],["f3","Supports e4."],["f4","Closes the kingside with tempo on the e3-bishop and prepares ...g5–g4.","f4e3"],["Bf2","The bishop retreats."],["g5","The pawn storm begins: ...g4 will try to open lines against White's king.","g5g4"]]},{"id":"slav","name":"Slav Defense (Czech)","eco":"D17–D19","side":"b","intro":"Black defends d5 with the c-pawn, keeping the c8-bishop free to develop outside the chain. In the Czech line Black takes on c4, plays ...Bf5 and builds a sturdy position with ...e6, ...Bb4 and castling.","ideas":["...c6 supports d5 without locking in the c8-bishop","...dxc4 then ...Bf5","Pin with ...Bb4 to slow e4","Answer e4–e5 with ...Nd5"],"structure":"Black: c6/e6 pawns, bishops outside the chain. White gets space with e4–e5; Black gets a solid, well-coordinated position.","moves":[["d4","White opens."],["d5","Stops e4."],["c4","Queen's Gambit."],["c6","The Slav: defend d5 with the c-pawn so the c8-bishop stays free."],["Nf3","Develops."],["Nf6","Develops."],["Nc3","More pressure on d5."],["dxc4","Now Black takes, intending ...b5 to hold the pawn."],["a4","Stops ...b5.","","b5"],["Bf5","The Czech: develop the bishop before ...e6, controlling e4.","f5e4"],["e3","Prepares Bxc4."],["e6","Opens the f8-bishop."],["Bxc4","White regains the pawn."],["Bb4","Pins the c3-knight, making e4 harder.","b4c3"],["O-O","White castles."],["O-O","Black castles."],["Qe2","Prepares e4."],["Nbd7","Develops and supports ...e5 or ...c5."],["e4","White finally plays e4."],["Bg6","The bishop steps back, staying on the useful diagonal."],["Bd3","Supports e4."],["Bh5","Pins the f3-knight.","h5e2"],["e5","White kicks the f6-knight."],["Nd5","The knight takes the strong d5-square.","d5c3"]]},{"id":"friedliver","name":"Fried Liver Attack (trap/attack)","eco":"C57","side":"w","intro":"In the Two Knights Defense, 4.Ng5 attacks f7 twice. After 4...d5 5.exd5 the natural 5...Nxd5? lets White sacrifice the knight on f7 and drag Black's king into the open. Learn the attack and also the correct defense (5...Na5!).","ideas":["Bc4 + Ng5 attack f7","Nxf7 sacrifice draws the king out","Qf3+ forks/pins on the f-file","Black's best is 5...Na5!, not 5...Nxd5"],"structure":"Open position; Black's king is stuck in the center on e6, and White plays d4 to open more lines.","moves":[["e4","White opens."],["e5","Black replies."],["Nf3","Attacks e5."],["Nc6","Defends."],["Bc4","Aims at f7.","c4f7","f7"],["Nf6","The Two Knights Defense: Black counterattacks e4."],["Ng5","A second attacker on f7!","g5f7 c4f7","f7"],["d5","Black blocks the bishop's diagonal.","d5c4"],["exd5","White takes the pawn. Now the obvious recapture ...Nxd5 removes a defender from the f7 area."],["Nxd5","Natural but risky — this allows the Fried Liver. 5...Na5! is correct.","g5f7"],["Nxf7","The famous sacrifice: the knight takes f7 and forks the queen and rook. (Engines slightly prefer 6.d4, the Lolli Attack, but Nxf7 is the classic practical blow.)","f7d8 f7h8"],["Kxf7","Black accepts; the king must come forward."],["Qf3+","Check on the f-file — and the queen also attacks the d5-knight, which the c4-bishop already hits.","f3d5 c4d5"],["Ke6","The king steps up to defend the d5-knight (going back would let White win it). Black is a piece up but the king is in the open."],["Nc3","A third attacker on the pinned knight.","c3d5"],["Nb4","The c6-knight (the d5-knight is pinned by the c4-bishop!) defends d5 again and threatens ...Nxc2+.","b4c2"],["Qe4","Keeps attacking d5 and centralizes; d4 is coming to open the e-file.","e4d5"],["c6","Supports d5."],["a3","Kicks the b4-knight."],["Na6","The knight retreats."],["d4","Opens lines toward Black's exposed king.","d4e5"],["Nc7","The knight returns to defend d5; White has a very strong attack (Bf4, O-O, Re1)."]],"sidelines":[{"name":"5...Na5! (the correct defense)","from":9,"moves":[["Na5","The right way: Black attacks the c4-bishop and gets fast development for a pawn.","a5c4"],["Bb5+","The bishop escapes with check."],["c6","Blocks with tempo."],["dxc6","White grabs a second pawn."],["bxc6","Black opens lines for development."],["Be2","The bishop retreats."],["h6","Kicks the g5-knight."],["Nf3","Retreat."],["e4","Gains space with tempo."],["Ne5","The knight finds a central post. Black has strong compensation for the pawn."]]}]},{"id":"legal","name":"Légal's Trap","eco":"C41","side":"w","intro":"A famous queen-sacrifice trap from the 1750s. If Black pins your knight with ...Bg4 and then plays carelessly, the knight breaks the pin, and taking the queen leads to mate with the minor pieces.","ideas":["A pinned piece is not always truly pinned","Bxf7+ and Nd5# — mate with three minor pieces","If Black declines with ...dxe5, Qxg4 wins a pawn"],"structure":"Open game; the point is the tactic, not the structure.","moves":[["e4","White opens."],["e5","Black replies."],["Nf3","Attacks e5."],["d6","The Philidor Defense: solid but passive."],["Bc4","Aims at f7.","c4f7"],["Bg4","Pins the knight to the queen.","g4d1"],["Nc3","Develops — and quietly prepares the trap."],["g6","A careless move. Black should develop with ...Nc6 or ...Nf6."],["Nxe5","The knight breaks the pin! It offers the queen.","e5f7"],["Bxd1","Greedy: Black takes the queen…"],["Bxf7+","Check! The king must move.","","f7"],["Ke7","The only legal move."],["Nd5#","Checkmate with three minor pieces: Légal's Mate.","d5e7"]],"sidelines":[{"name":"5...dxe5 (declining)","from":9,"moves":[["dxe5","Black takes the knight instead."],["Qxg4","White takes the bishop back and is a pawn up with a great position."]]}]},{"id":"blackburne","name":"Blackburne Shilling Trap","eco":"C50","side":"b","intro":"A cheeky trap for Black: 3...Nd4 invites 4.Nxe5?, which runs into ...Qg5!, and if White grabs more with 5.Nxf7?? the game ends in a smothered-style mate. Honest note: 3...Nd4 is objectively dubious — against 4.Nxd4 or 4.O-O Black is slightly worse.","ideas":["Bait: e5 is \"free\"","...Qg5 forks the e5-knight and g2","Final blow ...Nf3# with the knight and queen","Against correct play (4.Nxd4), just develop normally"],"structure":"The trap is tactical; the main lesson is to recognize greedy captures.","moves":[["e4","White opens."],["e5","Black replies."],["Nf3","Attacks e5."],["Nc6","Defends."],["Bc4","The Italian bishop."],["Nd4","The bait: e5 now looks undefended.","","e5"],["Nxe5","White takes the pawn — a mistake."],["Qg5","Attacks the e5-knight and the g2-pawn at the same time.","g5e5 g5g2"],["Nxf7","Greedy: the knight forks the queen and rook… but it ignores g2."],["Qxg2","Takes on g2 and attacks the h1-rook.","g2h1"],["Rf1","The rook escapes."],["Qxe4+","Check — the queen joins the attack.","e4e2"],["Be2","Blocks the check. (7.Qe2 also blocks, but 7...Qxe2+ 8.Bxe2 Nxc2+ forks king and rook.)"],["Nf3#","Checkmate! White's own pieces box the king in, the knight also covers d2, and the e2-bishop cannot take on f3 because the queen pins it.","f3e1"]],"sidelines":[{"name":"4.Nxd4 (the correct reply)","from":6,"moves":[["Nxd4","White just takes the knight."],["exd4","Black recaptures; the d4-pawn is a bit weak."],["O-O","White develops and will play c3 to open the center with an edge."]]}]}];
var STRAT = [{"id":"reti-tartakower","title":"Réti vs Tartakower, Vienna 1910","theme":"Double check","goalText":"White to move and mate in 3.","strategy":"Black's king is still in the center and the d-file is full of White firepower: rook on d1, queen on d3, bishop on d2. When the enemy king is stuck in the middle and your rook already controls the open file, look for a way to drag the king onto that file — then a bishop move can give double check.","explain":"9.Qd8+!! Kxd8 decoys the king onto the d-file. 10.Bg5+ is a double check (bishop and the d1-rook), so Black must move the king. After 10...Kc7 11.Bd8# the bishop mates, protected by the rook (10...Ke8 also loses to 11.Rd8#). A model queen sacrifice: the queen was the piece standing between the rook and the king.","fen":"rnb1kb1r/pp3ppp/2p5/4q3/4n3/3Q4/PPPB1PPP/2KR1BNR w kq - 0 9","goal":"mate","steps":[{"u":"d3d8","san":"Qd8+","acc":[],"h":"The d-file is the highway to Black's king. Can you bring the king onto it — even at the cost of your queen?","r":"e8d8","rs":"Kxd8"},{"u":"d2g5","san":"Bg5+","acc":[],"h":"Unmask the rook on d1: move the bishop with check so both pieces give check at once.","r":"d8c7","rs":"Kc7"},{"u":"g5d8","san":"Bd8#","acc":[],"h":"Only one square gives mate now — and the rook on d1 protects it."}]},{"id":"immortal","title":"The Immortal Game (Anderssen–Kieseritzky, 1851)","theme":"Mating attack","goalText":"White to move and mate in 3. You are down two rooks and a bishop!","strategy":"Material does not matter when the enemy king is trapped. White's minor pieces (knights on d5 and f5, bishop on d6) are all aimed at Black's king, and Black's queen and bishop are far away on the first rank. Count the checks and look for a sacrifice that opens one last square for a bishop.","explain":"21.Nxg7+ Kd8 forces the king to d8. 22.Qf6+!! gives up the queen to deflect the g8-knight: after 22...Nxf6 the e7-square is no longer defended, and 23.Be7# mates with three minor pieces: the d5-knight guards c7 and protects the bishop, the g7-knight covers e8, and Black's own pieces block c8 and d7.","fen":"r1b1k1nr/p2p1ppp/n2B4/1p1NPN1P/6P1/3P1Q2/P1P1K3/q5b1 w kq - 2 21","goal":"mate","steps":[{"u":"f5g7","san":"Nxg7+","acc":[],"h":"Start with a forcing move: which knight can capture with check?","r":"e8d8","rs":"Kd8"},{"u":"f3f6","san":"Qf6+","acc":[],"h":"Your queen is in the way. Offer it with check to pull a defender away from e7.","r":"g8f6","rs":"Nxf6"},{"u":"d6e7","san":"Be7#","acc":[],"h":"The e7-square has lost its defender. Which minor piece can land there?"}]},{"id":"evergreen","title":"The Evergreen Game (Anderssen–Dufresne, 1852)","theme":"Double check","goalText":"White to move. Black threatens mate on g2 — find the brilliant combination.","strategy":"Black just played ...Qxf3 and threatens ...Qxg2#. Only checks can save White, so think in forcing moves. The black king is on e8 with an open e-file and d-file, and your bishop on d3 sits in front of the d1-rook: that is a loaded battery waiting to give a discovered (or double) check once the d7-pawn disappears.","explain":"20.Rxe7+! Nxe7 (in the game; 20...Kd8 would have resisted longer) 21.Qxd7+!! Kxd7 22.Bf5+ — a double check from the bishop and the d1-rook. 22...Ke8 23.Bd7+ Kf8 24.Bxe7# — the a3-bishop finishes the job, with the f6-pawn protecting e7 and the d7-bishop covering e8.","fen":"1r2k1r1/pbppnp1p/1bn2P2/8/Q7/B1PB1q2/P4PPP/3RR1K1 w - - 0 20","goal":"mate","steps":[{"u":"e1e7","san":"Rxe7+","acc":[],"h":"You must keep giving checks. The e7-knight shields the king — remove it.","r":"c6e7","rs":"Nxe7"},{"u":"a4d7","san":"Qxd7+","acc":[],"h":"Clear the d-file: the d7-pawn is the only thing between your rook and the king. A queen sacrifice does it.","r":"e8d7","rs":"Kxd7"},{"u":"d3f5","san":"Bf5+","acc":[],"h":"Fire the d3-bishop / d1-rook battery so that both pieces give check.","r":"d7e8","rs":"Ke8"},{"u":"f5d7","san":"Bd7+","acc":[],"h":"Keep the king boxed in: check again with the bishop from d7.","r":"e8f8","rs":"Kf8"},{"u":"a3e7","san":"Bxe7#","acc":[],"h":"Your other bishop (on a3) has been eyeing e7 all along — capture with mate."}]},{"id":"opera","title":"The Opera Game (Morphy, Paris 1858)","theme":"Pins & back rank","goalText":"White to move. Finish Morphy's attack (it ends in mate).","strategy":"Two pins paralyze Black: the b5-bishop pins the d7-knight to the king, and the g5-bishop pins the f6-knight to the queen. Black's king is still in the center and the d-file is half-open. Keep adding attackers to pinned pieces faster than Black can add defenders, and remember the back rank — b8 and d8 are weak.","explain":"13.Rxd7! Rxd7 14.Rd1 piles up on the pinned d7-rook. 14...Qe6 adds a defender (and unpins the f6-knight), but 15.Bxd7+ Nxd7 16.Qb8+!! Nxb8 17.Rd8# — the rook mates on the back rank, supported by the g5-bishop. Development and open lines beat material.","fen":"3rkb1r/p2nqppp/5n2/1B2p1B1/4P3/1Q6/PPP2PPP/2KR3R w k - 3 13","goal":"mate","steps":[{"u":"d1d7","san":"Rxd7","acc":[],"h":"Win the pinned piece? Not yet — capture on d7 to keep the d-file open and the pins alive.","r":"d8d7","rs":"Rxd7"},{"u":"h1d1","san":"Rd1","acc":[],"h":"Bring the last piece into the attack: double on the d-file.","r":"e7e6","rs":"Qe6"},{"u":"b5d7","san":"Bxd7+","acc":[],"h":"Remove the defender of the back rank with check.","r":"f6d7","rs":"Nxd7"},{"u":"b3b8","san":"Qb8+","acc":[],"h":"Sacrifice the queen to deflect the knight from d7 — then the back rank is fatal.","r":"d7b8","rs":"Nxb8"},{"u":"d1d8","san":"Rd8#","acc":[],"h":"Mate on the back rank, protected by the g5-bishop."}]},{"id":"lasker-thomas","title":"Ed. Lasker vs Thomas, London 1912","theme":"King hunt","goalText":"White to move. Hunt the king all the way to g1 — mate in 8.","strategy":"Black's king has only the h7-pawn and the f6-bishop for cover. A queen sacrifice on h7 drags the king out, and then a discovered check by the knight (with the d3-bishop behind it) starts a king hunt. In a king hunt, every move must be a check (or a mate threat) and you push the king toward your own pieces.","explain":"11.Qxh7+!! Kxh7 12.Nxf6+ (double check from knight and bishop) Kh6 13.Neg4+ Kg5 14.h4+ Kf4 15.g3+ Kf3 16.Be2+ Kg2 17.Rh2+ Kg1 18.Kd2# (18.O-O-O# works too). The king was chased from g8 to g1 — mated by a king move discovering the h2-rook. (Faster finishes like 14.f4+ are also accepted.)","fen":"rn3rk1/pbppq1pp/1p2pb2/4N2Q/3PN3/3B4/PPP2PPP/R3K2R w KQ - 6 11","goal":"mate","steps":[{"u":"h5h7","san":"Qxh7+","acc":[],"h":"The h7-pawn is the king's only real shield. Remove it with your strongest piece.","r":"g8h7","rs":"Kxh7"},{"u":"e4f6","san":"Nxf6+","acc":[],"h":"Unmask the d3-bishop with a knight move that also gives check.","r":"h7h6","rs":"Kh6"},{"u":"e5g4","san":"Neg4+","acc":[],"h":"Keep checking with the other knight, pushing the king forward.","r":"h6g5","rs":"Kg5"},{"u":"h2h4","san":"h4+","acc":["f2f4"],"h":"Pawns can check too — push the h-pawn.","r":"g5f4","rs":"Kf4"},{"u":"g2g3","san":"g3+","acc":[],"h":"Another pawn check closes the net.","r":"f4f3","rs":"Kf3"},{"u":"d3e2","san":"Be2+","acc":["e1f1","e1g1"],"h":"Develop with check: the light-squared bishop.","r":"f3g2","rs":"Kg2"},{"u":"h1h2","san":"Rh2+","acc":["e1c1"],"h":"Rook check along the second rank.","r":"g2g1","rs":"Kg1"},{"u":"e1d2","san":"Kd2#","acc":["e1c1"],"h":"A quiet king move can deliver mate by discovering a rook."}]},{"id":"lasker-bauer","title":"Lasker vs Bauer, Amsterdam 1889 (part 2)","theme":"Mating attack","goalText":"White has already sacrificed a bishop on h7 and is a piece down. Find the only moves that keep the attack going and win material.","strategy":"The famous double bishop sacrifice. The queen on h5 is already close to the king; after removing the g7-pawn too, the king will be naked and White's rook can swing over via f3 to h3. The goal is not always mate — forcing play that ends with a fork or a big material gain is just as good.","explain":"17.Bxg7! Kxg7 18.Qg4+ Kh7 19.Rf3 (threatening Rh3+ and mate) e5 20.Rh3+ Qh6 21.Rxh6+ Kxh6 22.Qd7! forks the e7- and b7-bishops. After 22...Bf6 23.Qxb7 White has queen against rook and bishop plus two extra pawns — a winning material advantage. Lasker won soon after. Every White move in this line is the only good one: the alternatives fizzle out and leave White a piece down (19.Qh5+ only draws by perpetual).","fen":"r4rk1/1b2bpp1/ppq1p3/2ppB2Q/5P2/1P2P3/P1PP2PP/R4RK1 w - - 1 17","goal":"win","threshold":150,"steps":[{"u":"e5g7","san":"Bxg7","acc":[],"h":"Strip away the last pawn shield in front of the king.","r":"g8g7","rs":"Kxg7"},{"u":"h5g4","san":"Qg4+","acc":[],"h":"Check the king and keep your queen on the g-file/h-file.","r":"g7h7","rs":"Kh7"},{"u":"f1f3","san":"Rf3","acc":[],"h":"Bring the rook into the attack via the third rank.","r":"e6e5","rs":"e5"},{"u":"f3h3","san":"Rh3+","acc":[],"h":"Check on the h-file with the rook.","r":"c6h6","rs":"Qh6"},{"u":"h3h6","san":"Rxh6+","acc":["g4f5"],"h":"Take the queen that blocked the check.","r":"h7h6","rs":"Kxh6"},{"u":"g4d7","san":"Qd7","acc":[],"h":"A queen move that attacks two loose pieces at once."}]},{"id":"windmill","title":"The Windmill","theme":"Discovered attack","goalText":"White to move and win decisive material.","strategy":"Your rook on g7 sits in front of the f6-bishop, which points at Black's king on h8. Every rook move is a discovered check! When the king steps to g8, a rook check on the g-file sends it back to h8, and the \"windmill\" turns again: rook takes something with discovered check.","explain":"1.Rxf7+ (discovered check) Kg8 2.Rg7+ Kh8 (f8 is blocked by Black's own knight) 3.Rxd7+ Kg8 4.Rxc7 — the windmill grabbed a pawn, a bishop and the queen. White now has rook and bishop against a lone knight. (Torre–Lasker, Moscow 1925 is the most famous windmill.)","fen":"5n1k/2qb1pR1/p4B2/1p6/8/8/5PPP/6K1 w - - 0 1","goal":"win","threshold":300,"steps":[{"u":"g7f7","san":"Rxf7+","acc":[],"h":"Any rook move gives discovered check from the bishop. Which capture is most useful?","r":"h8g8","rs":"Kg8"},{"u":"f7g7","san":"Rg7+","acc":[],"h":"Send the king back to the corner with a rook check.","r":"g8h8","rs":"Kh8"},{"u":"g7d7","san":"Rxd7+","acc":[],"h":"Take another piece with discovered check — something that is defending the queen side.","r":"h8g8","rs":"Kg8"},{"u":"d7c7","san":"Rxc7","acc":[],"h":"Now collect the biggest prize."}]},{"id":"anastasia","title":"Anastasia's Mate","theme":"Mating attack","goalText":"White to move and mate in 4.","strategy":"Anastasia's mate pattern: a knight on e7 covers g8 and g6, while a rook delivers mate along the h-file against a king on h7 (blocked by its own g7-pawn). To get there you need the king on h7 and an open h-file — a queen sacrifice can do both.","explain":"1.Ne7+ Kh8 2.Qxh7+!! Kxh7 3.Rh3+ Qh5 4.Rxh5# — the knight on e7 controls g8 and g6, the pawn on g7 blocks the king, and the rook mates on the h-file.","fen":"r4rk1/5ppp/8/q2N3Q/8/5R2/5PPP/6K1 w - - 0 1","goal":"mate","steps":[{"u":"d5e7","san":"Ne7+","acc":[],"h":"Check with the knight on a square from which it controls g8 and g6.","r":"g8h8","rs":"Kh8"},{"u":"h5h7","san":"Qxh7+","acc":[],"h":"Open the h-file with the queen — even if it costs the queen.","r":"h8h7","rs":"Kxh7"},{"u":"f3h3","san":"Rh3+","acc":[],"h":"The rook swings to the h-file with check.","r":"a5h5","rs":"Qh5"},{"u":"h3h5","san":"Rxh5#","acc":[],"h":"Capture the blocker with mate."}]},{"id":"trade-down","title":"Trade into a won pawn ending","theme":"King & pawn endgames","goalText":"White to move and win.","strategy":"When you are a pawn up, trading pieces usually helps — but only if the resulting pawn ending is won! Here your king is already in front of its pawn and close to the key squares (d6, e6, f6). Trade rooks, then use your king actively: a king on the 6th rank in front of the pawn wins whatever Black does.","explain":"1.Rxd8! Kxd8 2.Kd6 (a key square: king two ranks in front of the pawn) Ke8 3.Ke6 Kf8 4.Kd7 — White's king controls the queening path (e7, e8) and the pawn walks in. Careless king moves such as 2.Kd5? or 2.Kf4? let Black's king reach the opposition, and it's only a draw.","fen":"3r4/4k3/8/4K3/4P3/8/8/3R4 w - - 0 1","goal":"win","threshold":300,"steps":[{"u":"d1d8","san":"Rxd8","acc":[],"h":"Simplify: offer the rook trade on your terms.","r":"e7d8","rs":"Kxd8"},{"u":"e5d6","san":"Kd6","acc":["e5f6","e5e6","e5f5"],"h":"Get your king to a key square on the 6th rank.","r":"d8e8","rs":"Ke8"},{"u":"d6e6","san":"Ke6","acc":["e4e5"],"h":"Keep the king in front of the pawn and take the opposition.","r":"e8f8","rs":"Kf8"},{"u":"e6d7","san":"Kd7","acc":["e4e5","e6f6","e6d5","e6d6"],"h":"Control the queening square with your king before pushing."}]},{"id":"perpetual","title":"Saving the game: perpetual check","theme":"Defensive resources","goalText":"White is losing on material and faces mate. Save the game — force a draw.","strategy":"Black is a rook up and threatens ...Rb1+ / ...Qa1+ mating on the back rank. You cannot defend everything, so look for perpetual check: your queen can check from e8 and h5 forever because Black's king has only g8 and h7, and the g7-pawn blocks its escape.","explain":"Qe8+ Kh7 Qh5+ Kg8 Qe8+ Kh7 Qh5+ Kg8 Qe8+ — the same position repeats three times: a draw by repetition. Black can never escape the checks, and any non-check by White would allow mate.","fen":"6k1/3Q2p1/8/8/8/8/qr3PPP/6K1 w - - 0 1","goal":"draw","drawThreshold":-60,"steps":[{"u":"d7e8","san":"Qe8+","acc":[],"h":"Check from the back rank.","r":"g8h7","rs":"Kh7"},{"u":"e8h5","san":"Qh5+","acc":[],"h":"Check from the h-file, the king has only g8 and h7.","r":"h7g8","rs":"Kg8"},{"u":"h5e8","san":"Qe8+","acc":[],"h":"Repeat the check from e8.","r":"g8h7","rs":"Kh7"},{"u":"e8h5","san":"Qh5+","acc":[],"h":"And again from h5.","r":"h7g8","rs":"Kg8"},{"u":"h5e8","san":"Qe8+","acc":[],"h":"One more check completes the threefold repetition."}]},{"id":"saavedra","title":"The Saavedra Position (1895)","theme":"Endgame studies","goalText":"White to move and win.","strategy":"Push the c-pawn, and escape the rook checks by walking your king toward the rook (approach on the diagonal so the rook runs out of checks). The famous twist: Black has a stalemate trick at the end, so you must promote to the right piece.","explain":"1.c7 Rd6+ 2.Kb5 Rd5+ 3.Kb4 Rd4+ 4.Kb3 Rd3+ 5.Kc2 Rd4! (threatening 6.c8=Q? Rc4+! 7.Qxc4 stalemate) 6.c8=R!! Ra4 (to stop Ra8#) 7.Kb3 — attacking the rook and threatening Rc1#. White wins. Underpromotion to a rook avoids the stalemate trap.","fen":"8/8/1KP5/3r4/8/8/8/k7 w - - 0 1","goal":"win","threshold":350,"steps":[{"u":"c6c7","san":"c7","acc":[],"h":"Push the pawn — the rook must check.","r":"d5d6","rs":"Rd6+"},{"u":"b6b5","san":"Kb5","acc":[],"h":"Approach the rook with your king.","r":"d6d5","rs":"Rd5+"},{"u":"b5b4","san":"Kb4","acc":[],"h":"Keep approaching down the b-file.","r":"d5d4","rs":"Rd4+"},{"u":"b4b3","san":"Kb3","acc":["b4c3"],"h":"Keep going; avoid squares where the rook can skewer or keep checking forever.","r":"d4d3","rs":"Rd3+"},{"u":"b3c2","san":"Kc2","acc":[],"h":"Hide on the c-file next to the pawn.","r":"d3d4","rs":"Rd4"},{"u":"c7c8r","san":"c8=R","acc":[],"h":"A queen allows a stalemate trick (…Rc4+). Promote to something else that still threatens mate.","r":"d4a4","rs":"Ra4"},{"u":"c2b3","san":"Kb3","acc":[],"h":"Attack the rook and threaten mate at the same time."}]},{"id":"reti-study","title":"The Réti Study (1921)","theme":"Endgame studies","goalText":"White to move and draw. It looks hopeless — the h-pawn is far away…","strategy":"The king can pursue two goals with one route. Walking diagonally (h8–g7–f6–e5) is as fast as walking straight, so White's king can chase the h-pawn and approach its own c-pawn at the same time. Black has to choose: stop the c-pawn and the king catches the h-pawn, or push the h-pawn and White supports c7.","explain":"1.Kg7! h4 2.Kf6 Kb6 (2...h3 3.Ke7 h2 4.c7 and both queen) 3.Ke5! Kxc6 4.Kf4 — the king enters the square of the h-pawn and catches it. A draw out of nowhere: the \"Réti manoeuvre\".","fen":"7K/8/k1P5/7p/8/8/8/8 w - - 0 1","goal":"draw","drawThreshold":-60,"steps":[{"u":"h8g7","san":"Kg7","acc":[],"h":"Move diagonally toward the center — that also chases the h-pawn.","r":"h5h4","rs":"h4"},{"u":"g7f6","san":"Kf6","acc":[],"h":"Keep walking the diagonal: threaten to support your c-pawn.","r":"a6b6","rs":"Kb6"},{"u":"f6e5","san":"Ke5","acc":[],"h":"Two threats at once: protect c6 or catch the pawn.","r":"b6c6","rs":"Kxc6"},{"u":"e5f4","san":"Kf4","acc":["e5e4"],"h":"Step into the square of the h-pawn."}]},{"id":"lucena","title":"The Lucena Position: building a bridge","theme":"Rook endgames","goalText":"White to move and win (promote the pawn).","strategy":"The most important winning technique in rook endings. Your king is stuck on b8 in front of the pawn, and the black rook will check it from the side. First put your rook on the 4th rank (the \"bridge\"), then walk the king out; when the checks come, step toward the rook so it can block a check on b4.","explain":"1.Rd4! Rc1 2.Ka7 Ra1+ 3.Kb6 Rb1+ 4.Kc6 Rc1+ 5.Kb5 Rb1+ 6.Rb4 — the rook blocks the last check and the pawn queens. Many first moves win (1.Re1+, 1.Rd5…); any move the engine confirms as winning is accepted.","fen":"1K6/1P2k3/8/8/8/8/2r5/3R4 w - - 0 1","goal":"win","threshold":200,"steps":[{"u":"d1d4","san":"Rd4","acc":["d1d5","d1b1","d1a1","d1e1","d1g1","d1d3"],"h":"Prepare a shelter: bring your rook to the 4th rank.","r":"c2c1","rs":"Rc1"},{"u":"b8a7","san":"Ka7","acc":["d4a4","d4d5","d4b4","d4g4","d4h4","d4e4","d4f4"],"h":"Walk the king out of the corner.","r":"c1a1","rs":"Ra1+"},{"u":"a7b6","san":"Kb6","acc":[],"h":"Step toward your rook.","r":"a1b1","rs":"Rb1+"},{"u":"b6c6","san":"Kc6","acc":["b6a6","b6c7"],"h":"Keep approaching the rook on the 4th rank.","r":"b1c1","rs":"Rc1+"},{"u":"c6b5","san":"Kb5","acc":[],"h":"One more step toward the rook.","r":"c1b1","rs":"Rb1+"},{"u":"d4b4","san":"Rb4","acc":[],"h":"Build the bridge: block the check with the rook."}]},{"id":"philidor","title":"The Philidor Defense (rook ending)","theme":"Rook endgames","goalText":"You are Black and a pawn down. Hold the draw.","strategy":"The defending recipe: keep your rook on the 6th rank so the white king cannot reach the 6th rank. When White pushes the pawn to the 6th, the king has no shelter anymore — then your rook drops to the 1st rank and checks from behind forever.","explain":"1...Rh6! (keep the 6th rank) 2.e6 Rh1! (the pawn took the king's shelter away) 3.Kd6 Rd1+ — endless checks from behind. The king can't hide, and the pawn can't advance without support. Draw.","fen":"4k3/R7/1r6/3KP3/8/8/8/8 b - - 0 1","goal":"draw","drawThreshold":-250,"steps":[{"u":"b6h6","san":"Rh6","acc":["b6g6"],"h":"Keep your rook on the 6th rank, far from White's king and pawn.","r":"e5e6","rs":"e6"},{"u":"h6h1","san":"Rh1","acc":["h6h2","h6h3"],"h":"The pawn reached the 6th — switch to checking from far behind.","r":"d5d6","rs":"Kd6"},{"u":"h1d1","san":"Rd1+","acc":[],"h":"Check from behind!"}]},{"id":"opposition","title":"King and pawn: the opposition","theme":"King & pawn endgames","goalText":"White to move and win (promote the pawn).","strategy":"In K+P vs K the stronger king must lead the pawn. The key squares of a pawn on e4 are d6, e6 and f6: if your king reaches one, you win. Use the opposition — kings facing each other with one square between them and the OTHER side to move — to force your way through.","explain":"1.Ke5! takes the opposition. After 1...Kf7 2.Kd6 Ke8 3.Ke6 Kd8 4.Kf7 the king controls e7/e8, and the pawn walks home: 4...Kd7 5.e5 Kd8 6.e6 Kc7 7.e7. Lead with the king, then push.","fen":"8/4k3/8/3K4/4P3/8/8/8 w - - 0 1","goal":"promote","steps":[{"u":"d5e5","san":"Ke5","acc":[],"h":"Take the opposition: face the black king with one square between you.","r":"e7f7","rs":"Kf7"},{"u":"e5d6","san":"Kd6","acc":["e5f5","e5d5"],"h":"Outflank: go to a key square on the 6th rank.","r":"f7e8","rs":"Ke8"},{"u":"d6e6","san":"Ke6","acc":["e4e5"],"h":"Stay in front of your pawn and keep the opposition.","r":"e8d8","rs":"Kd8"},{"u":"e6f7","san":"Kf7","acc":["e4e5","e6f6","e6f5","e6d6"],"h":"Take control of the queening path (e7/e8).","r":"d8d7","rs":"Kd7"},{"u":"e4e5","san":"e5","acc":["f7f6"],"h":"Now it is safe to push the pawn.","r":"d7d8","rs":"Kd8"},{"u":"e5e6","san":"e6","acc":["f7f6","f7e6","f7f8"],"h":"Keep pushing.","r":"d8c7","rs":"Kc7"},{"u":"e6e7","san":"e7","acc":["f7e8","f7f8","f7g7","f7g6","f7e7","f7g8","f7f6"],"h":"Almost there."}]},{"id":"square","title":"The rule of the square","theme":"King & pawn endgames","goalText":"You are Black. Catch the b-pawn and draw.","strategy":"Draw a square from the pawn to its promotion rank (b5–b8–e8–e5). If your king can step inside the square, it catches the pawn. White's king is too far away to help, so walk straight toward the promotion square.","explain":"1...Ke5! enters the square. 2.b6 Kd6 3.b7 Kc7 4.b8=Q+ Kxb8 — draw. Any other first move (e.g. 1...Kf5?) is one tempo too slow.","fen":"8/8/8/1P6/5k2/8/8/7K b - - 0 1","goal":"kpkdraw","drawThreshold":-60,"steps":[{"u":"f4e5","san":"Ke5","acc":[],"h":"Step into the square of the pawn (b5–e5–e8–b8).","r":"b5b6","rs":"b6"},{"u":"e5d6","san":"Kd6","acc":[],"h":"Head straight for the promotion corner.","r":"b6b7","rs":"b7"},{"u":"d6c7","san":"Kc7","acc":[],"h":"Guard the queening square.","r":"b7b8q","rs":"b8=Q+"},{"u":"c7b8","san":"Kxb8","acc":[],"h":"Capture the new queen."}]}];

   kpkProbe(fen) -> 'win' | 'draw' (for the side that owns the pawn) or null if not a KPK position. */
var KPK = (function () {
  var db = null; // index: stm(0=white to move,1=black)*64*64*64 + wk*4096 + bk*64 + p ; 0 unknown/draw, 1 win, 2 invalid

  stSetFb('✗ ' + esc(mv.san) + ' is not the strongest here — try again.' + (idea ? '<br><span style="font-weight:400;color:#9ec3ff">Idea: ' + esc(idea) + '</span>' : ''), 'bad');
  locked = true; st.busy = true; var tok = st.token;
  setTimeout(function(){ if (tok !== st.token) return; game.undo(); locked = false; st.busy = false; render(); }, 750);
  render();
}
function stAccept(mv, alt){
  var P = STRAT[st.idx];
  st.userMoves++; st.hintLevel = 0; st.dynBest = null; $('st-hint').classList.add('hidden');
  if (stGoalReached(mv)) { render(); return stSolve(); }
  var nUser = P.steps.length;
  if (!st.dyn) {
    var S = P.steps[st.step];
    if (st.step >= nUser - 1 || !S.r) { render(); return stSolve(); }
    stSetFb('✓ ' + esc(mv.san) + ' — good! Opponent is replying…', 'good');
    st.busy = true; var tok = st.token;
    st.timer = setTimeout(function(){
      if (tok !== st.token) return;
      var r = game.move({ from: S.r.slice(0,2), to: S.r.slice(2,4), promotion: S.r[4] });
      st.step++; st.busy = false; pendingAnim = r;
      stSetFb('Opponent played ' + esc(r.san) + '. Your move.', 'info');
      render();
    }, 600);
    render(); return;
  }
  // alternative accepted -> continue with engine replies
  if (P.goal !== 'mate' && st.userMoves >= nUser) { render(); return stSolve(); }
  stSetFb('✓ ' + esc(mv.san) + (alt ? ' — that works too! (not the main line; the computer will defend)' : ' — good!'), 'good');
  render();
  stEngineReply();
}
function stEngineReply(preset){
  var tok = st.token; st.busy = true;
  var go = function(r){
    if (tok !== st.token) return;
    if (!r.move) { st.busy = false; render(); if (stGoalReached()) stSolve(); return; }
    st.timer = setTimeout(function(){
      if (tok !== st.token) return;
      var mv = game.move({ from: r.move.slice(0,2), to: r.move.slice(2,4), promotion: r.move[4] || 'q' });
      st.busy = false; pendingAnim = mv;
      if (stGoalReached()) { render(); return stSolve(); }
      stSetFb('Opponent played ' + esc(mv.san) + '. Your move.', 'info');
      render();
    }, 450);
  };
  if (preset) go(preset); else engineAnalyze(gameStartFen(), uciHistory(), 1000, go);
}
function stDynCheck(mv){
  var P = STRAT[st.idx];
  if (stGoalReached(mv)) { st.userMoves++; render(); return stSolve(); }
  if (game.in_draw() || game.in_stalemate()) return stReject(mv, 'That allows a draw.');
  st.busy = true; locked = true; stSetFb('Checking ' + esc(mv.san) + '…', 'info'); render();
  var tok = st.token, kv = kpkVerdict();
  engineAnalyze(gameStartFen(), uciHistory(), 1200, function(r){
    if (tok !== st.token) return;
    locked = false; st.busy = false;
    var s = -(r.score || 0);  // from the solver's point of view
    var ok;
    if (kv) ok = kv === 'good';
    else if (P.goal === 'mate') ok = s > 90000 || s >= 500;
    else if (P.goal === 'win' || P.goal === 'promote') ok = s >= (P.threshold || 300);
    else ok = s >= (P.drawThreshold || -60);
    if (!ok) return stReject(mv, P.goal === 'mate' ? 'Keep the attack going with forcing moves.' : P.goal === 'win' || P.goal === 'promote' ? 'That move lets the win slip.' : 'That move loses — find the drawing idea.');
    st.userMoves++; st.hintLevel = 0; st.dynBest = null; $('st-hint').classList.add('hidden');
    var nUser = P.steps.length;
    if ((P.goal !== 'mate' && st.userMoves >= nUser) || (P.goal === 'mate' && st.userMoves >= nUser + 3 && s >= 500)) return stSolve();
    stSetFb('✓ ' + esc(mv.san) + ' keeps the ' + (P.goal === 'mate' ? 'attack' : P.goal === 'win' || P.goal === 'promote' ? 'win' : 'draw') + '. Opponent is replying…', 'good');
    render();
    stEngineReply(r);
  });
}
function stSolve(){
  var P = STRAT[st.idx];
  st.solved = true; st.busy = false; locked = false; hintSq = []; arrows = [];
  stSolvedSet[P.id] = true; try { localStorage.setItem('chess.strat.solved', JSON.stringify(stSolvedSet)); } catch(e) {}
  var how = game.in_checkmate() ? 'Checkmate! ' : (game.in_draw() ? 'Draw secured! ' : '');
  stSetFb('🎉 ' + how + 'Solved' + (st.failed ? ' (with retries)' : ' first try') + '!', 'good');
  $('st-explain').innerHTML = '<b>What happened:</b> ' + esc(P.explain);
  $('st-explain').classList.remove('hidden');
  $('st-hint').classList.add('hidden');
  $('st-tag').innerHTML = '<span class="ttag">' + esc(P.theme) + '</span> <span class="ttag" style="background:#2f3d52;color:#bcd3f2">' + P.steps.length + ' moves</span> <span class="ttag">✓ solved</span>';
  stDots(); render();
}
function stShowHints(lines){
  $('st-hint').innerHTML = '<ol>' + lines.map(function(l){ return '<li>' + l + '</li>'; }).join('') + '</ol>';
  $('st-hint').classList.remove('hidden');
}
function stHint(){
  if (st.solved || st.busy) return;
  var P = STRAT[st.idx];
  var show = function(best, idea){
    var t = new Chess(game.fen()), mv = t.move({ from: best.slice(0,2), to: best.slice(2,4), promotion: best[4] || 'q' }); if (!mv) return;
    st.hintLevel = Math.min(3, st.hintLevel + 1);
    var lines = ['<b>Idea:</b> ' + esc(idea)];
    if (st.hintLevel >= 2) { lines.push('<b>Piece:</b> use your ' + PIECE_NAME[mv.piece] + ' on ' + mv.from + '.'); hintSq = [mv.from]; }
    if (st.hintLevel >= 3) { lines.push('<b>Move:</b> ' + esc(mv.san)); arrows = [{ from: mv.from, to: mv.to, c: 'b' }]; }
    stShowHints(lines); render();
  };
  if (!st.dyn) { var S = P.steps[st.step]; return show(S.u, S.h); }
  if (st.dynBest) return show(st.dynBest.move, st.dynBest.idea);
  st.busy = true; stSetFb('Thinking about a hint…', 'info');
  var tok = st.token;
  engineAnalyze(gameStartFen(), uciHistory(), 1200, function(r){
    if (tok !== st.token) return; st.busy = false;
    if (!r.move) return;
    var t = new Chess(game.fen()), mv = t.move({ from: r.move.slice(0,2), to: r.move.slice(2,4), promotion: r.move[4] || 'q' });
    var idea = mv && /[+#]/.test(mv.san) ? 'A forcing check keeps the initiative.' : mv && mv.captured ? 'Something can be captured profitably.' : 'A quiet move that improves your position (or stops the opponent\'s idea).';
    st.dynBest = { move: r.move, idea: idea };
    stSetFb('Your move.', 'info');
    show(r.move, idea);
  });
}
function stUndo(){
  if (st.busy || locked) return;
  if (st.solved || st.dyn || st.userMoves === 0) { loadStrat(st.idx); return; }
  game.undo(); game.undo(); st.step = Math.max(0, st.step - 1); st.userMoves = Math.max(0, st.userMoves - 1);
  st.hintLevel = 0; hintSq = []; arrows = []; selected = null; dests = []; $('st-hint').classList.add('hidden');
  stSetFb('Took back a move. Your move.', 'info'); render();
}
fillThemes();
$('st-theme').addEventListener('change', function(){ st.theme = this.value; var l = stList(); if (l.indexOf(st.idx) < 0 && l.length) loadStrat(l[0]); else stDots(); if (l.indexOf(st.idx) >= 0) loadStrat(st.idx); });
$('st-prev').addEventListener('click', function(){ stStep(-1); });
$('st-next').addEventListener('click', function(){ stStep(1); });
$('st-retry').addEventListener('click', function(){ loadStrat(st.idx); });
$('st-hintbtn').addEventListener('click', stHint);
$('st-strat-btn').addEventListener('click', function(){ st.showStrat = !st.showStrat; $('st-strat').classList.toggle('hidden', !st.showStrat); this.textContent = st.showStrat ? '📖 Hide strategy' : '📖 Show strategy'; });
$('op-select').addEventListener('change', function(){ loadOpening(+this.value, false); });
$('op-line').addEventListener('change', function(){ opSetLine(this.value); });
$('op-sub').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) setOpSub(b.dataset.v); });
$('op-side').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) setOpSide(b.dataset.v); });
$('op-first').addEventListener('click', function(){ opGoto(0); });
$('op-back').addEventListener('click', function(){ opGoto(op.ply - 1); });
$('op-fwd').addEventListener('click', function(){ opGoto(op.ply + 1, true); });
$('op-last').addEventListener('click', function(){ opGoto(op.moves.length); });
$('op-hint').addEventListener('click', opHint);
$('op-restart').addEventListener('click', opReset);
$('op-playon').addEventListener('click', opPlayOn);


// ---------------- game controls ----------------
function newGame(fen){
  cancelThinking();
  game = new Chess(fen || START);
  if (mode === 'play') {
    userColor = colorPref === 'r' ? (Math.random() < 0.5 ? 'w' : 'b') : colorPref;
    orientation = userColor;
    var d = new Date();
    game.header('Event', 'Casual game', 'Date', d.getFullYear() + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + ('0' + d.getDate()).slice(-2),
      'White', userColor === 'w' ? 'Brandon' : 'Computer (' + level + ')', 'Black', userColor === 'b' ? 'Brandon' : 'Computer (' + level + ')');
  }
  selected = null; dests = []; hintSq = []; locked = false;
  $('engineinfo').textContent = '';
  buildBoard(); render();
  if (mode === 'play') setTimeout(requestEngineMove, 250);
}
function undo(){
  if (mode === 'openings') { opUndo(); return; }
  if (mode === 'strategy') { stUndo(); return; }
  if (mode === 'puzzle') {
    if (pz.solved || pz.step === 0) { loadPuzzle(pz.idx); return; }
    // take back user's last move and opponent's reply
    if (locked) return;
    game.undo(); game.undo(); pz.step = Math.max(0, pz.step - 2); hintSq = []; selected = null; dests = [];
    setFb('Took back a move. Your move.', 'info'); render(); return;
  }
  if (mode === 'play') {
    cancelThinking();
    // undo until it is the user's turn again (and at least one user move removed)
    var h = game.history().length;
    if (!h) return;
    game.undo();
    if (game.turn() !== userColor && game.history().length) game.undo();
  } else {
    game.undo();
  }
  selected = null; dests = [];
  render();
  if (mode === 'play') setTimeout(requestEngineMove, 250);
}
function setMode(m){
  cancelThinking();
  clearTimeout(op.timer); clearTimeout(st.timer); st.token++; op.busy = false;
  arrows = []; hintSq = [];
  mode = m;
  Array.prototype.forEach.call($('tabs').children, function(b){ b.classList.toggle('on', b.dataset.mode === m); });
  $('play-opts').classList.toggle('hidden', m !== 'play');
  $('puzzle-card').classList.toggle('hidden', m !== 'puzzle');
  $('op-card').classList.toggle('hidden', m !== 'openings');
  $('st-card').classList.toggle('hidden', m !== 'strategy');
  $('newgame').textContent = (m === 'puzzle' || m === 'strategy') ? 'Restart puzzle' : m === 'openings' ? 'Restart line' : 'New game';
  if (m === 'puzzle') loadPuzzle(pz.idx);
  else if (m === 'openings') loadOpening(op.idx, true);
  else if (m === 'strategy') loadStrat(st.idx);
  else { orientation = 'w'; newGame(); }
}
function toast(t){ var el = $('toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toast.t); toast.t = setTimeout(function(){ el.style.opacity = 0; }, 1400); }
function copyText(t, label){
  var fallback = function(){
    var ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    toast(ok ? label + ' copied' : 'Copy failed: select and copy manually');
    if (!ok) window.prompt('Copy ' + label + ':', t);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function(){ toast(label + ' copied'); }, fallback);
  else fallback();
}
function pgnText(){
  var ri = resultInfo();
  game.header('Result', ri.res);
  return game.pgn({ max_width: 80, newline_char: '\n' }) + (game.history().length ? '' : '');
}
function validateFen(f){
  var t = new Chess();
  var v = t.validate_fen(f);
  if (!v.valid) return v.error;
  var parts = f.trim().split(/\s+/);
  var opp = parts.slice(); opp[1] = parts[1] === 'w' ? 'b' : 'w'; opp[3] = '-';
  var t2 = new Chess(); if (t2.load(opp.join(' ')) && t2.in_check()) return 'The side not to move is in check.';
  var kings = { w: 0, b: 0 }; parts[0].split('').forEach(function(ch){ if (ch === 'K') kings.w++; if (ch === 'k') kings.b++; });
  if (kings.w !== 1 || kings.b !== 1) return 'Each side needs exactly one king.';
  return null;
}
function loadFenInput(){
  var f = $('fenin').value.trim(); if (!f) return;
  var parts = f.split(/\s+/);
  if (parts.length === 4) f += ' 0 1'; else if (parts.length === 5) f += ' 1';
  var err = validateFen(f);
  if (err) { toast('Invalid FEN: ' + err); return; }
  if (mode === 'puzzle' || mode === 'openings' || mode === 'strategy') { setMode('analysis'); }
  if (mode === 'play') {
    // user keeps their color; engine moves if it is its turn
    cancelThinking();
    game = new Chess(f);
    selected = null; dests = []; hintSq = [];
    buildBoard(); render(); setTimeout(requestEngineMove, 250);
  } else newGame(f);
  toast('Position loaded');
}

// ---------------- wire up ----------------
$('tabs').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b && b.dataset.mode !== mode) setMode(b.dataset.mode); });
function segInit(id, cb){
  $(id).addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b) return;
    Array.prototype.forEach.call($(id).children, function(x){ x.classList.toggle('on', x === b); }); cb(b.dataset.v); });
}
segInit('level', function(v){ level = v; render(); });
segInit('color', function(v){ colorPref = v; if (mode === 'play' && game.history().length === 0) newGame(); else toast('Takes effect on the next new game'); });
$('newgame').addEventListener('click', function(){ if (mode === 'puzzle') loadPuzzle(pz.idx); else if (mode === 'openings') opReset(); else if (mode === 'strategy') loadStrat(st.idx); else newGame(); });
$('undo').addEventListener('click', undo);
$('flip').addEventListener('click', function(){ orientation = orientation === 'w' ? 'b' : 'w'; buildBoard(); render(); });
$('copyfen').addEventListener('click', function(){ copyText(game.fen(), 'FEN'); });
$('copypgn').addEventListener('click', function(){ copyText(pgnText(), 'PGN'); });
$('loadfen').addEventListener('click', loadFenInput);
$('fenin').addEventListener('keydown', function(e){ if (e.key === 'Enter') loadFenInput(); });
$('pz-prev').addEventListener('click', function(){ loadPuzzle(pz.idx - 1); });
$('pz-next').addEventListener('click', function(){ loadPuzzle(pz.idx + 1); });
$('pz-retry').addEventListener('click', function(){ loadPuzzle(pz.idx); });
$('pz-hint').addEventListener('click', puzzleHint);
document.addEventListener('keydown', function(e){
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'f') $('flip').click();
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowLeft' && mode !== 'puzzle' && mode !== 'strategy') undo();
  if (e.key === 'ArrowRight' && mode === 'openings' && op.sub === 'learn') opGoto(op.ply + 1, true);
});

// expose a tiny API for testing / console use
window.chessApp = {
  get game(){ return game; }, get mode(){ return mode; }, setMode: setMode, loadPuzzle: loadPuzzle,
  openings: OPENINGS, strategy: STRAT, get op(){ return op; }, get st(){ return st; }, get arrows(){ return arrows; },
  loadOpening: loadOpening, loadStrat: loadStrat, opGoto: opGoto, setOpSub: setOpSub, setOpSide: setOpSide, opSetLine: opSetLine,
  get thinking(){ return thinking; }, get puzzle(){ return pz; }, puzzles: PUZZLES,
  usingWorker: function(){ return !!worker; }
};
setMode('play');
})();
</script>
